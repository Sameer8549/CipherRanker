<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 46px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .box{fill:#0f172a;stroke:#334155;stroke-width:2;rx:20;filter:url(#shadow)}
      .box2{fill:#111827;stroke:#475569;stroke-width:2;rx:20;filter:url(#shadow)}
      .accent{fill:url(#purple);rx:18}
      .h{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .p{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .tiny{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#93c5fd}
      .line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="82" class="title">CipherRanker System Architecture</text>
  <text x="82" y="122" class="subtitle">Local-first 100,000-candidate ranking with dual-AI rubric generation, evidence validation, risk audit, and reproducible exports</text>

  <!-- Inputs -->
  <rect x="80" y="190" width="300" height="145" class="box"/>
  <rect x="100" y="210" width="76" height="30" class="accent"/>
  <text x="112" y="231" class="tiny">INPUT</text>
  <text x="105" y="275" class="h">JD Input</text>
  <text x="105" y="305" class="p">Role requirements, skills,</text>
  <text x="105" y="329" class="p">experience, location, red flags</text>

  <rect x="80" y="440" width="300" height="160" class="box"/>
  <rect x="100" y="460" width="94" height="30" class="accent"/>
  <text x="112" y="481" class="tiny">DATASET</text>
  <text x="105" y="525" class="h">Candidate JSONL</text>
  <text x="105" y="555" class="p">100,000 profiles streamed</text>
  <text x="105" y="579" class="p">into local Node engine</text>

  <!-- AI rubric -->
  <rect x="480" y="150" width="310" height="110" class="box2"/>
  <text x="505" y="194" class="h">Groq Rubric</text>
  <text x="505" y="224" class="p">Independent JD extraction</text>

  <rect x="480" y="290" width="310" height="110" class="box2"/>
  <text x="505" y="334" class="h">Mistral Rubric</text>
  <text x="505" y="364" class="p">Independent JD extraction</text>

  <rect x="870" y="220" width="320" height="140" class="box"/>
  <rect x="892" y="240" width="122" height="30" class="accent"/>
  <text x="904" y="261" class="tiny">CONSENSUS</text>
  <text x="895" y="305" class="h">Scoring Rubric</text>
  <text x="895" y="335" class="p">Weighted requirements + fallback</text>

  <!-- Local pipeline -->
  <rect x="480" y="470" width="310" height="150" class="box"/>
  <text x="505" y="515" class="h">Local Ingestion API</text>
  <text x="505" y="545" class="p">Validation, SHA-256 hashing,</text>
  <text x="505" y="569" class="p">privacy boundary enforcement</text>

  <rect x="870" y="470" width="320" height="150" class="box"/>
  <text x="895" y="515" class="h">Feature Cache</text>
  <text x="895" y="545" class="p">Normalized candidate signals</text>
  <text x="895" y="569" class="p">for fast reproducible reruns</text>

  <rect x="1270" y="390" width="270" height="230" class="box"/>
  <rect x="1292" y="410" width="110" height="30" class="accent"/>
  <text x="1304" y="431" class="tiny">RANKING</text>
  <text x="1295" y="475" class="h">Worker Engine</text>
  <text x="1295" y="505" class="p">Parallel deterministic scoring</text>
  <text x="1295" y="529" class="p">career, skills, experience,</text>
  <text x="1295" y="553" class="p">education, behavior, risk</text>

  <!-- Audits -->
  <rect x="330" y="710" width="285" height="135" class="box2"/>
  <text x="355" y="756" class="h">Evidence Graph</text>
  <text x="355" y="786" class="p">field → requirement → score</text>

  <rect x="660" y="710" width="285" height="135" class="box2"/>
  <text x="685" y="756" class="h">Risk Audit</text>
  <text x="685" y="786" class="p">honeypots, duplicates, conflicts</text>

  <rect x="990" y="710" width="285" height="135" class="box2"/>
  <text x="1015" y="756" class="h">Stability Check</text>
  <text x="1015" y="786" class="p">weight perturbation confidence</text>

  <!-- Outputs -->
  <rect x="1330" y="700" width="210" height="170" class="box"/>
  <rect x="1350" y="720" width="100" height="30" class="accent"/>
  <text x="1362" y="741" class="tiny">OUTPUT</text>
  <text x="1355" y="785" class="h">Exports</text>
  <text x="1355" y="815" class="p">Top-100 CSV</text>
  <text x="1355" y="839" class="p">Full audit</text>
  <text x="1355" y="863" class="p">Manifest checksums</text>

  <!-- Arrows -->
  <path d="M380 260 C420 240 435 220 480 205" class="line"/>
  <path d="M380 260 C425 285 435 330 480 345" class="line"/>
  <path d="M790 205 C825 210 840 235 870 260" class="line"/>
  <path d="M790 345 C825 340 840 320 870 300" class="line"/>
  <path d="M380 520 C430 520 440 540 480 545" class="line"/>
  <path d="M790 545 C825 545 840 545 870 545" class="line"/>
  <path d="M1190 545 C1235 530 1240 495 1270 490" class="line"/>
  <path d="M1190 290 C1255 300 1260 430 1270 450" class="line"/>
  <path d="M1405 620 C1360 675 1270 705 1150 710" class="line"/>
  <path d="M1405 620 C1240 665 850 690 805 710" class="line"/>
  <path d="M1405 620 C1120 660 540 690 470 710" class="line"/>
  <path d="M1275 778 C1295 778 1310 778 1330 778" class="line"/>

  <!-- Boundary -->
  <rect x="450" y="430" width="1110" height="460" rx="26" class="dash"/>
  <text x="470" y="915" class="subtitle">Local machine boundary: full candidate data, scoring, caches, audits, and exports stay local</text>
</svg>
